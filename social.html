<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foldy · Social board</title>
<!--
  One viewport, six phones, all playing. Local only; not deployed.
  Record the whole window for a grid post, or record one phone for a thread.
  Keys:  1–6 solo a phone (others hide)  ·  0 show all  ·  R restart every clip  ·  H hide the caption strip
  Layout: two hero phones on top, four beneath. Query: ?bg=fff for a light background, ?w=1920&h=1080 to fix the board size.
-->
<style>
  :root { --bg: #09090b; --fg: #f5f5f7; --dim: rgba(245,245,247,.6); --accent: #e8542a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  .board { position: relative; width: 100vw; height: 100vh; display: grid; place-items: center; }
  /* Two rows sized in JS from whichever of width or height binds: a pair of heroes on top, four beneath. */
  .grid { display: flex; flex-direction: column; align-items: center; gap: var(--gap, 2vh); }
  .row { display: grid; gap: var(--gap, 2vh); }
  .row.hero { grid-template-columns: repeat(2, 1fr); width: var(--hero-w, 60vw); }
  .row.rest { grid-template-columns: repeat(4, 1fr); width: var(--rest-w, 90vw); }
  body.solo .row { display: none; }
  body.solo .row.on { display: grid; grid-template-columns: 1fr; width: var(--solo-w, 40vw); }
  body.solo .cell:not(.on) { display: none; }
  body.nocap .cap { display: none; }

  .cell { display: flex; flex-direction: column; align-items: center; gap: 1.2vh; }
  .cap { text-align: center; line-height: 1.25; white-space: nowrap; }
  .cap b { display: block; font-size: clamp(11px, 1.4vh, 18px); font-weight: 600; letter-spacing: -.01em; }
  .cap span { font-size: clamp(9px, 1.05vh, 14px); color: var(--dim); font-family: "SF Mono", ui-monospace, Menlo, monospace; }

  /* The phone body is baked into each clip by ffmpeg (682 x 1426 with the screen at 26,29), so the
     page draws nothing around the video. */
  .phone { position: relative; width: 100%; aspect-ratio: 682 / 1426; border-radius: 15.98% / 7.64%; overflow: hidden;
           box-shadow: 0 24px 40px rgba(0,0,0,.6); background: var(--bg); }
  .phone video, .phone img { width: 100%; height: 100%; display: block; object-fit: cover; }

  .brand { position: absolute; left: 2.2vw; bottom: 1.2vh; display: flex; align-items: center; gap: .6vw; font-weight: 600; font-size: clamp(12px, 1.6vh, 20px); color: var(--dim); }
  .brand svg { width: 1.8vh; height: 1.8vh; transform: rotate(-12deg); }
  .brand small { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-weight: 400; font-size: .75em; margin-left: .6vw; opacity: .7; }
  body.nocap .brand { display: none; }
</style>
</head>
<body>
<div class="board">
  <div class="grid" id="grid">
    <div class="row hero">
    <div class="cell"><div class="phone"><video muted loop playsinline preload="auto"><source src="media/stories.webm" type="video/webm"><source src="media/stories.mp4" type="video/mp4"></video></div><div class="cap"><b>Into the island</b><span>FoldCutoutGhost · liquid</span></div></div>
    <div class="cell"><div class="phone"><video muted loop playsinline preload="auto"><source src="media/wallet.webm" type="video/webm"><source src="media/wallet.mp4" type="video/mp4"></video></div><div class="cap"><b>Page turn</b><span>FoldTransition · .pageTurn</span></div></div>
    </div>
    <div class="row rest">
    <div class="cell"><div class="phone"><video muted loop playsinline preload="auto"><source src="media/weather.webm" type="video/webm"><source src="media/weather.mp4" type="video/mp4"></video></div><div class="cap"><b>Midnight glass</b><span>FoldAppearance.midnight</span></div></div>
    <div class="cell"><div class="phone"><video muted loop playsinline preload="auto"><source src="media/amalfi.webm" type="video/webm"><source src="media/amalfi.mp4" type="video/mp4"></video></div><div class="cap"><b>Swipe to fold</b><span>.foldSwipe(progress:)</span></div></div>
    <div class="cell"><div class="phone"><video muted loop playsinline preload="auto"><source src="media/steps.webm" type="video/webm"><source src="media/steps.mp4" type="video/mp4"></video></div><div class="cap"><b>Frosted</b><span>FoldStyle.frosted</span></div></div>
    <div class="cell"><div class="phone"><video muted loop playsinline preload="auto"><source src="media/boarding.webm" type="video/webm"><source src="media/boarding.mp4" type="video/mp4"></video></div><div class="cap"><b>Native UIKit</b><span>FoldContainerView</span></div></div>
    </div>
  </div>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#E8542A"/><path d="M8 21l8-4 8 4-8 4z" fill="#fff" opacity=".55"/><path d="M8 16l8-4 8 4-8 4z" fill="#fff" opacity=".8"/><path d="M8 11l8-4 8 4-8 4z" fill="#fff"/></svg>
    foldy <small>github.com/insanearts/foldy</small>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const cells = [...document.querySelectorAll('.cell')];
  if (q.get('bg')) document.documentElement.style.setProperty('--bg', '#' + q.get('bg'));
  if (q.get('bg') === 'fff') { document.documentElement.style.setProperty('--fg', '#111'); document.documentElement.style.setProperty('--dim', 'rgba(0,0,0,.55)'); }
  if (q.get('w') && q.get('h')) { document.body.style.width = q.get('w') + 'px'; document.body.style.height = q.get('h') + 'px'; }

  // Fit: two rows share the viewport height. The hero pair gets `HERO` of the phone height budget,
  // the four beneath the rest; each row is then also capped by the viewport width.
  const PHONE = 682 / 1426;
  const HERO = 0.56;
  function fit() {
    const solo = document.body.classList.contains('solo');
    const nocap = document.body.classList.contains('nocap');
    const cap = nocap ? 0 : Math.max(22, innerHeight * 0.042);
    const gap = Math.max(10, innerHeight * 0.014);
    const pad = innerHeight * 0.02, brand = nocap ? 0 : innerHeight * 0.04;
    document.documentElement.style.setProperty('--gap', gap + 'px');
    if (solo) {
      const h = innerHeight - 2 * pad - brand - cap;
      const w = Math.min(innerWidth - 2 * pad, h * PHONE);
      document.documentElement.style.setProperty('--solo-w', w + 'px');
      return;
    }
    const budget = innerHeight - 2 * pad - brand - gap - 2 * cap;   // phone heights, both rows
    const heroH = budget * HERO, restH = budget * (1 - HERO);
    const heroW = Math.min(heroH * PHONE, (innerWidth - 2 * pad - gap) / 2);
    const restW = Math.min(restH * PHONE, (innerWidth - 2 * pad - 3 * gap) / 4);
    document.documentElement.style.setProperty('--hero-w', (heroW * 2 + gap) + 'px');
    document.documentElement.style.setProperty('--rest-w', (restW * 4 + 3 * gap) + 'px');
  }
  addEventListener('resize', fit);
  new MutationObserver(fit).observe(document.body, { attributes: true, attributeFilter: ['class'] });
  fit();

  const videos = [...document.querySelectorAll('video')];
  // Start every clip from frame zero at the same instant, once all can play through.
  let ready = 0;
  videos.forEach(v => { v.addEventListener('canplaythrough', () => { if (++ready === videos.length) restart(); }, { once: true }); v.load(); });
  function restart() { videos.forEach(v => { v.currentTime = 0; v.play(); }); }

  addEventListener('keydown', e => {
    if (e.key >= '1' && e.key <= '6') {
      cells.forEach((c, i) => c.classList.toggle('on', i === Number(e.key) - 1));
      document.querySelectorAll('.row').forEach(r => r.classList.toggle('on', !!r.querySelector('.cell.on')));
      document.body.classList.add('solo'); restart();
    } else if (e.key === '0') {
      document.body.classList.remove('solo'); restart();
    } else if (e.key.toLowerCase() === 'r') {
      restart();
    } else if (e.key.toLowerCase() === 'h') {
      document.body.classList.toggle('nocap');
    }
  });
</script>
</body>
</html>
