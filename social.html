<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foldy · Social board</title>
<!--
  One viewport, six phones, all playing. Local only; not deployed.
  Record the whole window for a grid post, or record one phone for a thread.
  Keys:  1–6 solo a phone (others hide)  ·  0 show all  ·  R restart every clip  ·  H hide the caption strip
  Query: ?cols=2 for a 2×3 board, ?bg=fff for a light background, ?w=1920&h=1080 to fix the board size.
-->
<style>
  :root { --bg: #09090b; --fg: #f5f5f7; --dim: rgba(245,245,247,.6); --accent: #e8542a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  .board { position: relative; width: 100vw; height: 100vh; display: grid; place-items: center; }
  /* The grid is sized in JS from whichever of width or height binds, so all cells fit one viewport. */
  .grid { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: var(--gap, 2vh) var(--gap, 2vh); width: var(--grid-w, 90vw); }
  body.solo .cell:not(.on) { display: none; }
  body.nocap .cap { display: none; }

  .cell { display: flex; flex-direction: column; align-items: center; gap: 1.2vh; }
  .cap { text-align: center; line-height: 1.25; white-space: nowrap; }
  .cap b { display: block; font-size: clamp(11px, 1.4vh, 18px); font-weight: 600; letter-spacing: -.01em; }
  .cap span { font-size: clamp(9px, 1.05vh, 14px); color: var(--dim); font-family: "SF Mono", ui-monospace, Menlo, monospace; }

  /* iPhone Air. Body 156.2 x 74.7 mm around a 420 x 912 pt screen whose corners are 55 pt.
     The recording is a plain rectangle, so the screen box supplies the corners and the island. */
  .phone { position: relative; width: 100%; aspect-ratio: 747 / 1562;
           border-radius: 20% / 9.6%;
           background: linear-gradient(160deg, #3a3a3f, #17171a 45%, #0d0d10);
           box-shadow: inset 0 0 0 1px rgba(255,255,255,.22), inset 0 0 0 3px #0a0a0c, 0 2vh 5vh rgba(0,0,0,.65); }
  .phone .screen { position: absolute; left: 4.1%; right: 4.1%; top: 4.6%; bottom: 4.6%;
                   border-radius: 13.1% / 6.03%; overflow: hidden; background: #000; }
  .phone video, .phone img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .phone .island { position: absolute; top: 2.19%; left: 50%; width: 29.8%; height: 4.02%; transform: translateX(-50%);
                   background: #000; border-radius: 999px; z-index: 2; }
  .phone::before, .phone::after { content: ""; position: absolute; width: 1.2%; border-radius: 2px; background: #1e1e22; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .phone::before { left: -1.2%; top: 20%; height: 9%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 13% 0 0 #1e1e22; }
  .phone::after { right: -1.2%; top: 24%; height: 13%; }

  .brand { position: absolute; left: 2.2vw; bottom: 2vh; display: flex; align-items: center; gap: .6vw; font-weight: 600; font-size: clamp(12px, 1.6vh, 20px); color: var(--dim); }
  .brand svg { width: 1.8vh; height: 1.8vh; transform: rotate(-12deg); }
  .brand small { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-weight: 400; font-size: .75em; margin-left: .6vw; opacity: .7; }
  body.nocap .brand { display: none; }
</style>
</head>
<body>
<div class="board">
  <div class="grid" id="grid">
    <div class="cell"><div class="phone"><div class="screen"><div class="island"></div>
      <video muted loop playsinline preload="auto"><source src="media/stories.webm" type="video/webm"><source src="media/stories.mp4" type="video/mp4"></video>
    </div></div><div class="cap"><b>Into the island</b><span>FoldCutoutGhost · liquid</span></div></div>
    <div class="cell"><div class="phone"><div class="screen"><div class="island"></div>
      <video muted loop playsinline preload="auto"><source src="media/wallet.webm" type="video/webm"><source src="media/wallet.mp4" type="video/mp4"></video>
    </div></div><div class="cap"><b>Page turn</b><span>FoldTransition · .pageTurn</span></div></div>
    <div class="cell"><div class="phone"><div class="screen"><div class="island"></div>
      <video muted loop playsinline preload="auto"><source src="media/weather.webm" type="video/webm"><source src="media/weather.mp4" type="video/mp4"></video>
    </div></div><div class="cap"><b>Midnight glass</b><span>FoldAppearance.midnight</span></div></div>
    <div class="cell"><div class="phone"><div class="screen"><div class="island"></div>
      <video muted loop playsinline preload="auto"><source src="media/amalfi.webm" type="video/webm"><source src="media/amalfi.mp4" type="video/mp4"></video>
    </div></div><div class="cap"><b>Swipe to fold</b><span>.foldSwipe(progress:)</span></div></div>
    <div class="cell"><div class="phone"><div class="screen"><div class="island"></div>
      <video muted loop playsinline preload="auto"><source src="media/steps.webm" type="video/webm"><source src="media/steps.mp4" type="video/mp4"></video>
    </div></div><div class="cap"><b>Frosted</b><span>FoldStyle.frosted</span></div></div>
    <div class="cell"><div class="phone"><div class="screen"><div class="island"></div>
      <video muted loop playsinline preload="auto"><source src="media/boarding.webm" type="video/webm"><source src="media/boarding.mp4" type="video/mp4"></video>
    </div></div><div class="cap"><b>Native UIKit</b><span>FoldContainerView</span></div></div>
  </div>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#E8542A"/><path d="M8 21l8-4 8 4-8 4z" fill="#fff" opacity=".55"/><path d="M8 16l8-4 8 4-8 4z" fill="#fff" opacity=".8"/><path d="M8 11l8-4 8 4-8 4z" fill="#fff"/></svg>
    foldy <small>github.com/tornikegomareli/Foldy</small>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const cols = Number(q.get('cols') || 3);
  const cells = [...document.querySelectorAll('.cell')];
  document.documentElement.style.setProperty('--cols', cols);
  document.documentElement.style.setProperty('--rows', Math.ceil(cells.length / cols));
  if (q.get('bg')) document.documentElement.style.setProperty('--bg', '#' + q.get('bg'));
  if (q.get('bg') === 'fff') { document.documentElement.style.setProperty('--fg', '#111'); document.documentElement.style.setProperty('--dim', 'rgba(0,0,0,.55)'); }
  if (q.get('w') && q.get('h')) { document.body.style.width = q.get('w') + 'px'; document.body.style.height = q.get('h') + 'px'; }

  // Fit: each cell is a phone (aspect 747/1562) plus a caption; solve for the largest phone width
  // that fits both the viewport width and height, then set the grid width from it.
  const PHONE = 747 / 1562;
  function fit() {
    const solo = document.body.classList.contains('solo');
    const c = solo ? 1 : cols, r = solo ? 1 : Math.ceil(cells.length / cols);
    const nocap = document.body.classList.contains('nocap');
    const cap = nocap ? 0 : Math.max(26, innerHeight * 0.048);
    const gap = Math.max(12, innerHeight * 0.02);
    const pad = innerHeight * 0.05, brand = nocap ? 0 : innerHeight * 0.05;
    const byH = (innerHeight - 2 * pad - brand - (r - 1) * gap) / r - cap;      // phone height limit
    const byW = (innerWidth - 2 * pad - (c - 1) * gap) / c;                    // phone width limit
    const w = Math.max(80, Math.min(byW, byH * PHONE));
    document.documentElement.style.setProperty('--gap', gap + 'px');
    document.documentElement.style.setProperty('--grid-w', (w * c + (c - 1) * gap) + 'px');
  }
  addEventListener('resize', fit);
  new MutationObserver(fit).observe(document.body, { attributes: true, attributeFilter: ['class'] });
  fit();

  const videos = [...document.querySelectorAll('video')];
  // Start every clip from frame zero at the same instant, once all can play through.
  let ready = 0;
  videos.forEach(v => { v.addEventListener('canplaythrough', () => { if (++ready === videos.length) restart(); }, { once: true }); v.load(); });
  function restart() { videos.forEach(v => { v.currentTime = 0; v.play(); }); }

  addEventListener('keydown', e => {
    if (e.key >= '1' && e.key <= '6') {
      cells.forEach((c, i) => c.classList.toggle('on', i === Number(e.key) - 1));
      document.body.classList.add('solo'); restart();
    } else if (e.key === '0') {
      document.body.classList.remove('solo'); restart();
    } else if (e.key.toLowerCase() === 'r') {
      restart();
    } else if (e.key.toLowerCase() === 'h') {
      document.body.classList.toggle('nocap');
    }
  });
</script>
</body>
</html>
